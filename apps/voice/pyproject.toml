[project]
name = "ondra-voice"
version = "0.1.0"
description = "Ondra's voice agent: LiveKit Agents worker on the shared tool layer"
requires-python = ">=3.12"
dependencies = [
  "ondra-core",
  "ondra-api",
  "livekit-agents[anthropic,elevenlabs]~=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ondra_voice"]
