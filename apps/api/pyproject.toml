[project]
name = "ondra-api"
version = "0.1.0"
description = "Ondra core API"
requires-python = ">=3.12"
dependencies = [
  "ondra-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.10",
  "email-validator>=2.2",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ondra_api"]
