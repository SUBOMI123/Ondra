[project]
name = "ondra-core"
version = "0.1.0"
description = "Shared models, permissions and interfaces for Ondra's Python services"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "pgvector>=0.3.6",
    "anthropic>=1.0",
    "pyyaml>=6.0.4",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ondra_core"]
