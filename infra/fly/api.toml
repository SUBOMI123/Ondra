# Ondra API and job worker on Fly.io (staging). One image (apps/api/Dockerfile), two process groups.
# Deploy from the repo root:  fly deploy . -c infra/fly/api.toml --dockerfile apps/api/Dockerfile
# Docs checked 2026-11-27 (docs.fly.io reference/configuration, launch/processes): release_command runs once per
# deploy in a temporary Machine with the new image and stops the deploy if it fails; [processes] commands replace
# the image's CMD; [[vm]] with `processes` sizes each group.

app = "ondra-api-staging"
primary_region = "sjc"  # San Jose: the nearest open region to the Supabase project (us-west-2, Oregon); sea is deprecated

[deploy]
  # Migrations as the owner role, then the demo dealership if the database is empty (SEED_PASSWORD required).
  release_command = "sh -c 'alembic upgrade head && python -m ondra_api.seed --if-empty'"

[processes]
  # No --proxy-headers: X-Forwarded-For's left-most entry is whatever the client sent. The caller's IP comes from
  # Fly-Client-IP instead (security.client_ip).
  app = "uvicorn ondra_api.main:app --host 0.0.0.0 --port 8000"
  worker = "python -m ondra_api.worker"

[env]
  APP_BASE_URL = "https://app.useondra.com"
  PUBLIC_API_URL = "https://api.useondra.com"
  AUTH_PROVIDER = "local"
  # Staging holds demo data only. Before a real dealer's data goes here, switch to Clerk (MFA) and remove this.
  ALLOW_LOCAL_AUTH_ON_PUBLIC_SITE = "true"

[http_service]
  internal_port = 8000
  force_https = true
  # Always on: live updates hold a connection open and Twilio's webhooks can't wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
